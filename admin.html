<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шабашка — Admin Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #E8510A; --orange-light: #FFF0E8; --orange-dark: #B33D06;
  --dark: #14151A; --gray: #6B6B67; --gray-light: #F4F3EF; --border: #E5E4E0;
  --white: #FFFFFF; --green: #1A7A4A; --green-bg: #E8F5EE; --blue: #185FA5;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--dark); }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.stat-card-label { font-size: 12.5px; color: var(--gray); margin-bottom: 8px; }
.stat-card-num { font-size: 26px; font-weight: 800; }

.quick-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.quick-link { display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--dark); transition: border-color .15s, background .15s; }
.quick-link:hover { border-color: var(--orange); background: var(--orange-light); }
.quick-link-icon { font-size: 22px; width: 40px; height: 40px; border-radius: 10px; background: var(--gray-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.quick-link-title { font-size: 14px; font-weight: 700; }
.quick-link-sub { font-size: 12px; color: var(--gray); margin-top: 2px; }

.section-title { font-size: 15px; font-weight: 700; margin: 24px 0 12px; }
@media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } .quick-links { grid-template-columns: 1fr; } }
</style>
<script src="/data.js"></script>
<script src="/admin-data.js"></script>
<script src="/admin-nav.js"></script>
</head>
<body>
<script>
ShabashkaAdminNav.renderAdminShell('dashboard', 'Dashboard').then(function (rendered) {
if (rendered) {
  const A = ShabashkaAdmin;

  document.getElementById('admContentRoot').innerHTML = '<div style="padding:60px;text-align:center;color:var(--gray)">Загрузка…</div>';

  var token = A.getAdminToken();
  var role = A.getAdminRole();
  fetch('/api/admin-stats?adminToken=' + encodeURIComponent(token) + '&adminRole=' + encodeURIComponent(role))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var totals = (data.ok && data.totals) ? data.totals : { jobs: 0, responses: 0, users: 0, done: 0, revenue: 0 };

      var links = [
        { href: '/admin-users', icon: '👥', title: 'Пользователи', sub: 'Все зарегистрированные', sectionId: 'users' },
        { href: '/admin-orders', icon: '📋', title: 'Заказы', sub: 'Все заказы платформы', sectionId: 'orders' },
        { href: '/admin-workers', icon: '⭐', title: 'Исполнители', sub: 'Верификация, блокировки', sectionId: 'workers' },
        { href: '/admin-complaints', icon: '⚠️', title: 'Жалобы и споры', sub: 'Рассмотрение конфликтов', sectionId: 'complaints' },
        { href: '/admin-reviews', icon: '🏆', title: 'Отзывы', sub: 'Модерация отзывов', sectionId: 'reviews' },
        { href: '/admin-finance', icon: '💰', title: 'Финансы', sub: 'Комиссии, выручка', sectionId: 'finance' },
        { href: '/admin-feedback', icon: '💬', title: 'Обращения', sub: 'Вопросы пользователей', sectionId: null },
        { href: '/admin-content', icon: '📝', title: 'Контент', sub: 'Категории, FAQ', sectionId: 'content' },
        { href: '/admin-settings', icon: '⚙️', title: 'Настройки', sub: 'Комиссия, тарифы', sectionId: 'settings' },
        { href: '/admin-security', icon: '🔒', title: 'Безопасность', sub: 'Подозрительные аккаунты', sectionId: 'security' },
      ].filter(function(l) { return l.sectionId === null || A.canAccessSection(l.sectionId); });

      document.getElementById('admContentRoot').innerHTML = `
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-card-label">Пользователей всего</div><div class="stat-card-num" style="color:var(--blue)">${totals.users}</div></div>
          <div class="stat-card"><div class="stat-card-label">Заказов всего</div><div class="stat-card-num" style="color:var(--orange)">${totals.jobs}</div></div>
          <div class="stat-card"><div class="stat-card-label">Завершено заказов</div><div class="stat-card-num" style="color:var(--green)">${totals.done}</div></div>
          <div class="stat-card"><div class="stat-card-label">Доход платформы</div><div class="stat-card-num">${totals.revenue.toLocaleString('ru')} ₽</div></div>
        </div>

        <div class="section-title">Разделы</div>
        <div class="quick-links">
          ${links.map(function(l) {
            return '<a class="quick-link" href="' + l.href + '">' +
              '<div class="quick-link-icon">' + l.icon + '</div>' +
              '<div><div class="quick-link-title">' + l.title + '</div><div class="quick-link-sub">' + l.sub + '</div></div>' +
              '</a>';
          }).join('')}
        </div>
      `;
    })
    .catch(function() {
      document.getElementById('admContentRoot').innerHTML = '<div style="padding:60px;text-align:center;color:var(--red)">Не удалось загрузить статистику</div>';
    });
}
});
</script>
</body>
</html>
