<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #E8510A; --orange-light: #FFF0E8; --orange-dark: #B33D06;
  --dark: #1A1A18; --gray: #6B6B67; --gray-light: #F4F3EF;
  --border: #E2E1DB; --white: #FFFFFF; --green: #1A7A4A; --green-bg: #E8F5EE;
  --radius: 10px; --blue: #185FA5; --blue-bg: #E6F1FB;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-light); color: var(--dark); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
#shabashka-nav { flex-shrink: 0; }
.site-footer { display: none; }

/* NAV */
nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 12px; height: 52px; flex-shrink: 0; }
.back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray); padding: 4px; }
.nav-title { font-size: 15px; font-weight: 600; }
.nav-sub { font-size: 12px; color: var(--gray); }
.nav-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

/* LAYOUT */
.layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* SIDEBAR */
.sidebar { width: 260px; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.sidebar-title { font-size: 13px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.4px; }
.convo-list { overflow-y: auto; flex: 1; }
.convo-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; display: flex; gap: 10px; align-items: flex-start; }
.convo-item:hover { background: var(--gray-light); }
.convo-item.active { background: var(--orange-light); border-left: 3px solid var(--orange); }
.convo-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--white); flex-shrink: 0; }
.convo-info { flex: 1; min-width: 0; }
.convo-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo-preview { font-size: 12px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.convo-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.convo-time { font-size: 11px; color: var(--gray); }
.unread-badge { background: var(--orange); color: var(--white); font-size: 10px; font-weight: 700; border-radius: 20px; padding: 1px 6px; }

/* CHAT AREA */
.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* JOB BANNER */
.job-banner { background: var(--white); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.job-banner-icon { font-size: 22px; }
.job-banner-info { flex: 1; }
.job-banner-title { font-size: 14px; font-weight: 600; }
.job-banner-detail { font-size: 12px; color: var(--gray); }
.job-banner-pay { font-size: 15px; font-weight: 700; color: var(--orange); }
.status-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.status-open { background: var(--green-bg); color: var(--green); }
.status-pending { background: #FFF0E8; color: var(--orange-dark); }

/* MESSAGES */
.messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

.msg-group { display: flex; flex-direction: column; gap: 4px; }
.msg-row { display: flex; gap: 8px; align-items: flex-end; }
.msg-row.me { flex-direction: row-reverse; }

.msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--white); flex-shrink: 0; }

.bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; position: relative; }
.bubble.them { background: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble.me { background: var(--orange); color: var(--white); border-bottom-right-radius: 4px; }
.bubble.ai { background: var(--blue-bg); border: 1px solid #C5DCF5; border-bottom-left-radius: 4px; color: var(--dark); }

.msg-time { font-size: 11px; color: var(--gray); margin: 0 4px; }
.msg-row.me .msg-time { text-align: right; }

.sender-name { font-size: 11px; color: var(--gray); margin-bottom: 2px; padding-left: 36px; }
.sender-name.me-name { text-align: right; padding-left: 0; padding-right: 36px; }

.ai-label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--blue); font-weight: 600; margin-bottom: 4px; }

/* SYSTEM MESSAGE */
.sys-msg { text-align: center; font-size: 12px; color: var(--gray); padding: 4px 12px; background: var(--gray-light); border-radius: 20px; align-self: center; }

/* QUICK REPLIES */
.quick-replies { padding: 8px 20px; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; }
.quick-replies::-webkit-scrollbar { display: none; }
.quick-btn { white-space: nowrap; padding: 8px 16px; border: 1.5px solid #E2E1DB; border-radius: 20px; font-size: 13px; background: #fff; cursor: pointer; color: #14151A; font-family: inherit; font-weight: 500; transition: all 0.15s; flex-shrink: 0; }
.quick-btn:hover, .quick-btn:active { border-color: #E8510A; color: #E8510A; background: #FFF0E8; }
.msg-read { font-size: 11px; font-weight: 600; line-height: 1; }
.msg-read.sent { color: #9A9A96; }
.msg-read.delivered { color: #9A9A96; }
.msg-read.read { color: #1A7A4A; }

/* INPUT */
.input-area { padding: 12px 16px; background: var(--white); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
.chat-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 14px; font-family: inherit; resize: none; outline: none; max-height: 120px; overflow-y: auto; line-height: 1.4; transition: border 0.15s; }
.chat-input:focus { border-color: var(--orange); }
.send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--orange); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
.send-btn:hover { background: var(--orange-dark); }
.send-btn svg { width: 18px; height: 18px; fill: white; }
.ai-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--blue-bg); border: 1px solid #C5DCF5; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; transition: background 0.15s; }
.ai-btn:hover { background: #D0E8F7; }

/* TYPING */
.typing-indicator { display: flex; align-items: center; gap: 4px; padding: 10px 14px; background: var(--white); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content; }
.typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); animation: bounce 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

/* CONFIRM PANEL */
.confirm-panel { margin: 0 20px 12px; background: var(--green-bg); border: 1px solid #A8DDB8; border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 12px; }
.confirm-text { flex: 1; font-size: 13px; color: var(--green); }
.confirm-text strong { display: block; font-size: 14px; margin-bottom: 2px; color: #0F5030; }
.confirm-btns { display: flex; gap: 8px; }
.btn-accept { background: var(--green); color: var(--white); border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-decline { background: none; border: 1px solid #A8DDB8; border-radius: 8px; padding: 7px 14px; font-size: 13px; color: var(--green); cursor: pointer; }

@media (max-width: 600px) {
  .sidebar { display: none; }
  body { padding-bottom: 70px; }
  nav { display: none !important; }
  #shabashka-nav { display: none; }
  .chat-layout { height: calc(100dvh - 108px - 60px) !important; }
  .chat-header { padding: 10px 14px; }
  .chat-messages { padding: 10px 12px; }
  .bubble { max-width: 88%; font-size: 14px; padding: 8px 12px; }
  .chat-input-bar { padding: 8px 12px; gap: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .chat-input { font-size: 16px; }
  .send-btn { width: 40px; height: 40px; font-size: 18px; }
  .ai-btn { padding: 8px 12px; font-size: 12px; }
  /* Мобильный список чатов */
  #mobileChatList { display: flex !important; }
}
.mobile-bottom-nav { position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #E5E4E0;display:none;align-items:center;justify-content:space-around;z-index:200; }
.mobile-nav-btn { display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:8px 12px;color:#6B6B67;font-family:inherit; }
.mobile-nav-btn.active { color:#E8510A; }

@media (max-width: 600px) { .site-footer { display: none !important; } .sb-role-toggle { padding: 2px !important; } .sb-role-btn { padding: 5px 8px !important; font-size: 10.5px !important; } .sb-links { display: none !important; } .sb-burger { display: none !important; } .back-btn { display: none !important; } }

<script>
Shabashka.renderNav('chat');

let CONVOS = [];

const MESSAGES_DB = {};

const QUICK = {};

// Умные ответы исходя из последнего сообщения
function getSmartReplies(convoId) {
  var msgs = MESSAGES_DB[convoId] || [];
  var last = msgs.filter(function(m){ return m.type === 'them'; }).pop();
  if (!last) return QUICK[convoId] || [];

  var text = last.text.toLowerCase();
  if (text.includes('опыт') || text.includes('умеете') || text.includes('навык')) {
    return ['Да, есть опыт ✓', 'Несколько лет опыта', 'Впервые, но готов научиться', 'Можем обсудить подробнее'];
  }
  if (text.includes('сколько') && (text.includes('час') || text.includes('врем'))) {
    return ['Примерно 4 часа', 'За день справлюсь', 'Зависит от объёма', 'Уточните задачу'];
  }
  if (text.includes('когда') || text.includes('во сколько') || text.includes('время')) {
    return ['В 9 утра', 'В 10:00', 'Когда скажете', 'После 12:00'];
  }
  if (text.includes('цен') || text.includes('оплат') || text.includes('₽')) {
    return ['Устраивает ✓', 'Могу за меньше', 'Давайте обсудим', 'Наличными удобнее'];
  }
  if (text.includes('адрес') || text.includes('где') || text.includes('куда')) {
    return ['Ок, записал адрес', 'Скину геолокацию', 'Буду вовремя', 'На карте покажите?'];
  }
  if (text.includes('спасибо') || text.includes('отлично') || text.includes('хорошо')) {
    return ['И вам спасибо! 🙏', 'Рад помочь', 'До следующего раза', 'Оставьте отзыв!'];
  }
  return QUICK[convoId] || ['Понял, принято ✓', 'Хорошо', 'Уточните пожалуйста', 'Договорились!'];
}

// Добавляем статус read к историческим сообщениям от меня
Object.keys(MESSAGES_DB).forEach(function(convoId) {
  MESSAGES_DB[convoId].forEach(function(m) {
    if (m.type === 'me' && !m.read) m.read = 'read';
  });
});

let currentConvo = null;
let typingTimeout = null;
let myId = null; // id текущего пользователя в БД — резолвится асинхронно при загрузке

function colorFromId(id) {
  var palette = ['#E8510A','#185FA5','#1A7A4A','#7C3AED','#DB2777','#0891B2'];
  return palette[(id || 0) % palette.length];
}

function searchChats(query) {
  var q = query.toLowerCase().trim();
  var filtered = q
    ? CONVOS.filter(function(c) {
        return c.name.toLowerCase().includes(q) ||
               c.preview.toLowerCase().includes(q) ||
               (c.jobTitle && c.jobTitle.toLowerCase().includes(q));
      })
    : CONVOS;

  var list = document.getElementById('convoList');
  if (!filtered.length) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:#9A9A96;font-size:13px">Ничего не найдено</div>';
    return;
  }
  list.innerHTML = filtered.map(function(c) {
    var isActive = c.id === currentConvo;
    return '<div class="convo-item' + (isActive ? ' active' : '') + '" onclick="switchConvo(\'' + c.id + '\')">' +
      '<div class="convo-avatar" style="background:' + c.color + '">' + c.name[0] + '</div>' +
      '<div class="convo-info">' +
        '<div class="convo-name">' + highlightMatch(c.name, q) + '</div>' +
        '<div class="convo-preview">' + highlightMatch(c.preview, q) + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">' +
        '<span class="convo-time">' + c.time + '</span>' +
        (c.unread > 0 ? '<span class="convo-badge">' + c.unread + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function highlightMatch(text, query) {
  if (!query) return text;
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) +
    '<mark style="background:#FFF0E8;color:#E8510A;border-radius:2px">' +
    text.slice(idx, idx + query.length) +
    '</mark>' +
    text.slice(idx + query.length);
}

function renderSidebar() {
  document.getElementById('convoList').innerHTML = CONVOS.map(c => `
    <div class="convo-item ${c.id === currentConvo ? 'active' : ''}" onclick="switchConvo('${c.id}')">
      <div class="convo-avatar" style="background:${c.color}">${c.name[0]}</div>
      <div class="convo-info">
        <div class="convo-name">${c.name}</div>
        <div class="convo-preview">${c.preview}</div>
      </div>
      <div class="convo-meta">
        <span class="convo-time">${c.time}</span>
        ${c.unread ? `<span class="unread-badge">${c.unread}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function openReportModal() {
  if (!currentConvo) { alert('Сначала откройте диалог'); return; }
  document.getElementById('reportReason').value = '';
  document.getElementById('reportError').style.display = 'none';
  document.getElementById('reportModal').style.display = 'flex';
}
function closeReportModal() {
  document.getElementById('reportModal').style.display = 'none';
}
function submitReport() {
  const c = CONVOS.find(x => x.id === currentConvo);
  const reason = document.getElementById('reportReason').value.trim();
  const errEl = document.getElementById('reportError');
  if (!reason) { errEl.textContent = 'Опишите, что произошло'; errEl.style.display = 'block'; return; }
  if (!c || !c.otherId) { errEl.textContent = 'Не удалось определить собеседника'; errEl.style.display = 'block'; return; }
  if (!myId) { errEl.textContent = 'Не удалось определить ваш аккаунт'; errEl.style.display = 'block'; return; }

  fetch('/api/db-complaints', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reporter_id: myId, target_id: c.otherId, job_id: c.jobId, reason: reason }),
  })
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (!data.ok) { errEl.textContent = data.error || 'Не удалось отправить жалобу'; errEl.style.display = 'block'; return; }
      closeReportModal();
      var t = document.createElement('div');
      t.textContent = '✅ Жалоба отправлена, мы её рассмотрим';
      t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#14151A;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:10000;white-space:nowrap';
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 3000);
    })
    .catch(function() { errEl.textContent = 'Не удалось отправить, проверьте соединение'; errEl.style.display = 'block'; });
}

function switchConvo(id) {
  currentConvo = id;
  const c = CONVOS.find(x => x.id === id);
  if (!c) return;
  var navName = document.getElementById('navName');
  var navJob = document.getElementById('navJob');
  var bannerIcon = document.getElementById('bannerIcon');
  var bannerTitle = document.getElementById('bannerTitle');
  var bannerDetail = document.getElementById('bannerDetail');
  var bannerPay = document.getElementById('bannerPay');
  var confirmPanel = document.getElementById('confirmPanel');
  if (navName) navName.textContent = c.name;
  if (navJob) navJob.textContent = c.job;
  if (bannerIcon) bannerIcon.textContent = c.icon;
  if (bannerTitle) bannerTitle.textContent = c.job;
  if (bannerDetail) bannerDetail.textContent = '📅 ' + c.date;
  if (bannerPay) bannerPay.textContent = c.pay;
  var jobBanner = document.getElementById('jobBanner');
  var emptyChat = document.getElementById('emptyChat');
  var messagesEl = document.getElementById('messages');
  if (jobBanner) jobBanner.style.display = c.isDirect ? 'none' : 'flex';
  if (emptyChat) emptyChat.style.display = 'none';
  if (messagesEl) messagesEl.style.display = 'flex';
  c.unread = 0;
  syncUnreadCount();
  renderSidebar();
  renderMessages();
  renderQuickReplies();
  if (confirmPanel) confirmPanel.style.display = 'none';

  // Реальные сообщения из БД
  if (myId) {
    var fetchUrl = c.isDirect
      ? '/api/db-messages?peer_id=' + c.peerId + '&user_id=' + myId
      : '/api/db-messages?job_id=' + c.jobId + '&user_id=' + myId;
    fetch(fetchUrl)
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (currentConvo !== id) return; // уже переключились на другой чат
        if (data.ok && data.messages) {
          MESSAGES_DB[id] = data.messages.map(function(m) {
            return {
              type: m.sender_id === myId ? 'me' : 'them',
              text: m.text,
              time: formatMsgTime(m.created_at),
              read: m.is_read ? 'read' : 'sent',
            };
          });
          renderMessages();
        }
        // Отмечаем прочитанным
        fetch('/api/db-messages', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(c.isDirect ? { peer_id: c.peerId, user_id: myId } : { job_id: c.jobId, user_id: myId }),
        }).catch(function(){});
      })
      .catch(function(){ console.log('БД недоступна, показываем локальную историю'); });
  }
}

function formatMsgTime(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}

function renderMessages() {
  const msgs = MESSAGES_DB[currentConvo] || [];
  const c = CONVOS.find(x => x.id === currentConvo);
  const el = document.getElementById('messages');
  el.innerHTML = msgs.map(m => {
    if (m.type === 'sys') return `<div class="sys-msg">${m.text}</div>`;
    if (m.type === 'ai') return `
      <div class="msg-group">
        <div class="ai-label">🤖 AI-ассистент Шабашки</div>
        <div class="msg-row">
          <div class="bubble ai">${m.text}</div>
          <span class="msg-time">${m.time}</span>
        </div>
      </div>`;
    const isMe = m.type === 'me';
    const readStatus = isMe ? (function() {
      if (m.read === 'read') return '<span class="msg-read read">✓✓</span>';
      if (m.read === 'delivered') return '<span class="msg-read delivered">✓✓</span>';
      return '<span class="msg-read sent">✓</span>';
    })() : '';
    return `
      <div class="msg-group">
        <div class="${isMe ? 'sender-name me-name' : 'sender-name'}">${isMe ? 'Вы' : c.name}</div>
        <div class="msg-row ${isMe ? 'me' : ''}">
          ${!isMe ? `<div class="msg-avatar" style="background:${c.color}">${c.name[0]}</div>` : ''}
          <div class="bubble ${isMe ? 'me' : 'them'}">${m.text}</div>
          <div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'};gap:2px">
            <span class="msg-time">${m.time}</span>
            ${readStatus}
          </div>
          ${isMe ? `<div class="msg-avatar" style="background:#888">Я</div>` : ''}
        </div>
      </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function renderQuickReplies() {
  var qs = getSmartReplies(currentConvo);
  var el = document.getElementById('quickReplies');
  if (!qs.length) { el.innerHTML = ''; return; }
  el.innerHTML = qs.map(function(q) {
    return '<button class="quick-btn" onclick="sendQuick(\'' + q.replace(/'/g, "\\'") + '\')">' + q + '</button>';
  }).join('');
}

function sendQuick(text) {
  document.getElementById('chatInput').value = text;
  sendMsg();
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const now = new Date();
  const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  MESSAGES_DB[currentConvo] = MESSAGES_DB[currentConvo] || [];
  MESSAGES_DB[currentConvo].push({ type:'me', text, time, read: 'sent' });
  const c = CONVOS.find(x => x.id === currentConvo);
  c.preview = text;
  c.time = time;
  input.value = '';
  input.style.height = 'auto';
  renderMessages();
  renderSidebar();
  renderQuickReplies();

  // Сохраняем в базу данных: job_id — только для чатов по заказу,
  // для прямых сообщений (без заказа) job_id не указываем.
  if (myId) {
    fetch('/api/db-messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        job_id: c && !c.isDirect ? c.jobId : null,
        sender_id: myId,
        receiver_id: c ? c.otherId || null : null,
        text: text,
      })
    }).catch(function(){
      console.log('БД недоступна, сообщение сохранено только локально');
      showSendWarning('Сообщение не дошло до собеседника — нет связи с сервером.');
    });
  } else {
    // Без определённого аккаунта сообщение уходит только в память браузера
    // и никогда не долетит до собеседника — молчать об этом нельзя.
    showSendWarning('Не удалось определить ваш аккаунт — сообщение не отправлено собеседнику. Попробуйте войти заново.');
  }
}

function showSendWarning(text) {
  var t = document.createElement('div');
  t.textContent = '⚠️ ' + text;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#B91C1C;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:10000;white-space:nowrap;max-width:90%;text-overflow:ellipsis;overflow:hidden';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4000);
}

function showTyping() {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = 'typingIndicator';
  div.className = 'msg-group';
  const c = CONVOS.find(x => x.id === currentConvo);
  div.innerHTML = `
    <div class="msg-row">
      <div class="msg-avatar" style="background:${c.color}">${c.name[0]}</div>
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

async function askAI() {
  const input = document.getElementById('chatInput');
  const userText = input.value.trim();
  const c = CONVOS.find(x => x.id === currentConvo);
  const msgs = MESSAGES_DB[currentConvo] || [];
  const history = msgs.filter(m => m.type !== 'sys' && !m.isAI)
    .map(m => `${m.type === 'me' ? 'Исполнитель' : 'Заказчик'}: ${m.text}`).join('\n');

  const question = userText || 'Что мне стоит уточнить у заказчика?';
  input.value = '';

  showTyping();

  const contextLine = c.isDirect
    ? 'Это личная переписка, не привязанная к конкретному заказу.'
    : `Заказ: "${c.job}", оплата: ${c.pay}, дата: ${c.date}.`;
  const systemPrompt = `Ты AI-ассистент платформы "Шабашка" — маркетплейса разовых подработок. 
Помогаешь исполнителям и заказчикам общаться эффективно. 
${contextLine}
Переписка:\n${history}
Отвечай кратко, по-русски, практично. Не более 2-3 предложений.`;

  try {
    const res = await fetch('/api/ai-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, systemPrompt })
    });
    const data = await res.json();
    hideTyping();

    if (!res.ok) {
      // Сервер вернул понятную ошибку (например, ключ не настроен)
      MESSAGES_DB[currentConvo].push({ type:'ai', text: '⚠️ ' + (data.error || 'AI-помощник временно недоступен.'), time: nowTime(), isAI: true });
      renderMessages();
      return;
    }

    const text = data.text || 'Не удалось получить ответ.';
    MESSAGES_DB[currentConvo].push({ type:'ai', text: '💡 ' + text, time: nowTime(), isAI: true });
    renderMessages();
  } catch(e) {
    hideTyping();
    MESSAGES_DB[currentConvo].push({ type:'ai', text: '⚠️ Не удалось связаться с AI-помощником. Проверьте подключение.', time: nowTime(), isAI: true });
    renderMessages();
  }
}

function nowTime() {
  const now = new Date();
  return now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
}

// Обновляем глобальный счётчик непрочитанных из текущего состояния CONVOS
function syncUnreadCount() {
  var total = CONVOS.reduce(function(s, c) { return s + (c.unread || 0); }, 0);
  Shabashka.setUnreadCount(total);
}

// init перенесён в async-блок ниже (загружает реальные диалоги из БД
// перед первым рендером)
(function init() {
  Shabashka.ensureDbUserId().then(function (id) {
    myId = id;

    function afterConvosLoaded() {
      handleQueryParams();
      CONVOS.forEach(function(c) { if (c.id === currentConvo) c.unread = 0; });
      syncUnreadCount();
      renderSidebar();
      renderQuickReplies();
      initMobileChatList();
    }

    if (!myId) {
      var emptyEl = document.getElementById('emptyChat');
      if (emptyEl) {
        emptyEl.style.display = 'flex';
        emptyEl.innerHTML =
          '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
          '<div style="font-size:17px;font-weight:700;color:#14151A;margin-bottom:8px">Не удалось загрузить сообщения</div>' +
          '<div style="font-size:14px;line-height:1.6">Не получилось определить ваш аккаунт в базе.<br>' +
          'Попробуйте <a href="/register" style="color:#E8510A">войти заново</a> — это быстро, без повторной анкеты, если аккаунт уже есть.</div>';
      }
      afterConvosLoaded();
      return;
    }

    fetch('/api/db-messages?user_id=' + myId)
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (data.ok && data.conversations) {
          CONVOS = data.conversations.map(function(c) {
            var isDirect = !c.job_id;
            return {
              id: isDirect ? 'direct-' + c.other_id : 'job-' + c.job_id,
              jobId: c.job_id || null,
              peerId: isDirect ? c.other_id : null,
              isDirect: isDirect,
              name: c.other_name || 'Собеседник',
              job: isDirect ? 'Личные сообщения' : c.job_title,
              icon: isDirect ? '💬' : (c.emoji || '📦'),
              pay: '',
              date: '',
              color: colorFromId(c.other_id),
              otherId: c.other_id,
              unread: 0,
              time: formatMsgTime(c.created_at),
              preview: c.text,
            };
          });
        }
        afterConvosLoaded();
      })
      .catch(function() {
        console.log('БД недоступна, список диалогов пуст');
        afterConvosLoaded();
      });
  });
})();

function handleQueryParams() {
  const jobId = Shabashka.jobIdFromQuery();
  if (jobId) {
    const existing = CONVOS.find(c => c.jobId === Number(jobId) && !c.isDirect);
    if (existing) {
      currentConvo = existing.id;
      switchConvo(currentConvo);
      return;
    }
    const job = Shabashka.getJob(jobId);
    if (job) {
      const newConvo = {
        id: 'job-' + job.id, // id диалога = id заказа в БД — без этого сообщения "терялись"
        jobId: job.id,
        isDirect: false,
        name: job.company,
        job: job.title,
        icon: job.emoji,
        pay: Shabashka.rub(job.pay),
        date: job.date + ' · ' + job.location,
        color: job.colors[0],
        unread: 0,
        time: 'сейчас',
        preview: 'Чат начат',
        otherId: null,
      };
      CONVOS.unshift(newConvo);
      MESSAGES_DB[newConvo.id] = [
        { type: 'sys', text: 'Вы откликнулись на заказ «' + job.title + '»' },
      ];
      currentConvo = newConvo.id;
      renderSidebar();

      // Локальный объект заказа не хранит employer_id — подтягиваем
      // из БД, иначе сообщение не будет знать, кому его доставить.
      fetch('/api/db-jobs?action=get&id=' + job.id)
        .then(function(r){ return r.json(); })
        .then(function(data) {
          if (data.ok && data.job) newConvo.otherId = data.job.employer_id;
        })
        .catch(function(){})
        .finally(function() { switchConvo(currentConvo); });
      return;
    }
  }

  if (!currentConvo) {
    const workerParam = new URLSearchParams(window.location.search).get('worker')
      || new URLSearchParams(window.location.search).get('with');
    if (workerParam) {
      const peerId = Number(workerParam);
      const existing = CONVOS.find(c => c.isDirect && c.otherId === peerId);
      if (existing) {
        currentConvo = existing.id;
        switchConvo(currentConvo);
        return;
      }

      const newConvo = {
        id: 'direct-' + peerId,
        jobId: null,
        peerId: peerId,
        isDirect: true,
        name: 'Загрузка…',
        job: 'Личные сообщения',
        icon: '💬',
        pay: '', date: '',
        color: colorFromId(peerId),
        unread: 0,
        time: 'сейчас',
        preview: 'Чат начат',
        otherId: peerId,
      };
      CONVOS.unshift(newConvo);
      MESSAGES_DB[newConvo.id] = [];
      currentConvo = newConvo.id;
      renderSidebar();

      // Подтягиваем имя собеседника из БД, чтобы шапка чата не висела "Загрузка…"
      fetch('/api/db-users?id=' + peerId)
        .then(function(r){ return r.json(); })
        .then(function(data) {
          if (data.ok && data.user) newConvo.name = data.user.name || 'Собеседник';
        })
        .catch(function(){})
        .finally(function() { switchConvo(currentConvo); });
      return;
    }
  }

  if (currentConvo) switchConvo(currentConvo);
}

function initMobileChatList() {
  var isMobile = window.innerWidth <= 600;
  var mobileHeader = document.getElementById('mobileChatHeader');
  if (mobileHeader) mobileHeader.style.display = isMobile ? 'block' : 'none';
  if (!isMobile) return;

  var listEl = document.getElementById('mobileChatList');
  if (!listEl) return;
  listEl.innerHTML = CONVOS.map(function(c) {
    var isActive = c.id === currentConvo;
    return '<div onclick="switchConvo(\'' + c.id + '\')" style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;min-width:48px">' +
      '<div style="width:44px;height:44px;border-radius:50%;background:' + (c.color||'#E8510A') + ';display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;border:' + (isActive?'2.5px solid #E8510A':'2.5px solid transparent') + ';position:relative;box-sizing:border-box">' +
      c.name[0] +
      (c.unread > 0 ? '<span style="position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:#E8510A;border-radius:50%;border:2px solid #fff;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 2px">' + c.unread + '</span>' : '') +
      '</div>' +
      '<div style="font-size:9.5px;color:' + (isActive?'#E8510A':'#6B6B67') + ';font-weight:' + (isActive?'700':'500') + ';max-width:48px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + c.name.split(' ')[0] + '</div>' +
      '</div>';
  }).join('');
}

renderQuickReplies();
